environment: development
trading_mode: paper
live_trading_enabled: false
initial_capital: 10000
max_risk_per_trade: 0.01

database:
  path: data/database/trading_system.db

logging:
  level: INFO
  path: logs/application.log

timezone: Asia/Kolkata

backtest:
  max_open_positions: 10
  strategy:
    version: sr_baseline_v1
    swing_left: 3
    swing_right: 3
    zone_tolerance_pct: 0.01
    minimum_zone_pivots: 2
    maximum_zone_age_sessions: 252
    minimum_touch_separation_sessions: 5
    support_min_close_location: 0.65
    support_max_penetration_pct: 1.0
    zone_break_close_buffer_pct: 0.005
    support_stop_buffer_pct: 0.002
    breakout_distance_pct: 0.002
    retest_tolerance_pct: 0.01
    maximum_retest_sessions: 20
    breakout_invalidation_pct: 0.01
    breakout_minimum_touches: 2
    breakout_min_close_location: 0.60
    breakout_stop_buffer_pct: 0.002
    volume_lookback_sessions: 20
    volume_ratio_threshold: null
    weekly_sma_weeks: 4
    weekly_require_higher_close: true
    target_r_variants: [1.5, 2.0, 2.5, 3.0]
    weekly_filter_default: false
  strategy_zone_v2:
    version: sr_zone_v2
    atr_period: 14
    atr_half_width: 0.5
    minimum_width_pct: 0.0025
    maximum_width_pct: 0.01
    cluster_distance_atr: 0.75
    departure_atr: 0.5
    reaction_horizon: 5
    break_atr: 0.5
  weekly_selection:
    version: sr_zone_v2_weekly_selection_v1
    benchmark_path: data/raw/reference/nifty50_daily.csv
    minimum_completed_weeks: 26
    short_return_weeks: 4
    long_return_weeks: 13
    structure_minimum: 1
    momentum_minimum: 2
    relative_strength_minimum: 1
    total_score_minimum: 5
    strong_close_location: 0.65
    minimum_trend_efficiency: 0.15
    nearby_resistance_atr: 0.75
    nearby_support_atr: 1.5
    resistance_breakout_exception: true
  weekly_regime:
    minimum_completed_weeks: 26
    close_trend_weeks: 13
    short_return_weeks: 4
    long_return_weeks: 13
    slope_weeks: 13
    atr_weeks: 14
    minimum_trend_efficiency: 0.15
    bullish_vote_threshold: 4
    weak_vote_threshold: 4
    minimum_return_4w: 0.0
    minimum_return_13w: 0.0
    minimum_slope_pct_per_week: 0.0
    minimum_directional_move_atr: 0.0
  structural_exit:
    default_mode: FIXED_R_EXIT
    stop_buffer_atr: 0.25
    minimum_stop_buffer_pct: 0.001
    target_buffer_atr: 0.10
    minimum_target_buffer_pct: 0.001
    minimum_reward_risk: 1.5
    maximum_holding_sessions: 15
    no_target_policy: REJECT
    fallback_reward_risk: 2.0
  transaction_costs:
    # Current official Zerodha/NSE delivery assumptions, checked 2026-09-24.
    # Proportional amounts are fractions of turnover; DP includes its GST.
    scenario: CURRENT_ZERODHA_EQUITY_DELIVERY_2026
    brokerage_rate: 0.0
    stt_buy_rate: 0.001
    stt_sell_rate: 0.001
    nse_transaction_rate: 0.0000307
    gst_rate: 0.18
    sebi_rate: 0.000001
    stamp_buy_rate: 0.00015
    ipft_rate: 0.000000001
    dp_charge_per_sell: 15.34  # Male primary holder; once per scrip per sell date.
    slippage_bps: 0.0
    verification_label: CURRENT_ZERODHA_EQUITY_DELIVERY_2026
    verified_on: "2026-09-24"
    provenance: "https://zerodha.com/charges; https://support.zerodha.com/category/account-opening/resident-individual/ri-charges/articles/what-do-dp-charges-mean; https://support.zerodha.com/category/account-opening/resident-individual/ri-charges/articles/how-is-the-securities-transaction-tax-stt-calculated"
  operating_costs:
    kite_connect_monthly: 500
    hosting_monthly: 0
    other_monthly: 0
    apply_to_economic_results: true

data:
  history_start_date: "2023-01-01"
  history_end_date: "yesterday"
